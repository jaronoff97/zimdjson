name: ci
on:
  pull_request:
  push:
    branches:
      - main

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      # v2 knows the zig-<arch>-<os> tarball names of Zig 0.15 and later.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Only the suites that compile on Zig 0.16. These still fail to compile
      # since the 0.16 port and need their own port: minefield, adversarial,
      # examples, float-parsing and ring-buffer (removed std.fs/std.posix
      # APIs), and schema (src/ondemand.zig:3419, '?usize' for 'usize').
      - name: Run test suite 'ondemand'
        run: zig build tests/ondemand
      - name: Run test suite 'truncated input'
        run: zig build tests/truncated-input
      - name: Run test suite 'token buffer'
        run: zig build tests/token-buffer

  docs:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
      # v2 knows the zig-<arch>-<os> tarball names of Zig 0.15 and later.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Generate documentation
        run: zig build docs

      - name: Publish
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "zimdjson"
          directory: "zig-out/docs"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
